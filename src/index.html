<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>🧘 Berlin VHS Explorer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load SQL.js WebAssembly Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

<div class="max-w-7xl mx-auto px-4 py-6">
    <header class="mb-6 flex justify-between items-center border-b pb-4">
        <div>
            <h1 class="text-3xl font-bold text-indigo-900">🧘 Berlin VHS Explorer</h1>
            <p class="text-sm text-gray-500">Fast, client-side SQLite browser for Berlin Volkshochschule Open Data.</p>
        </div>
        <button id="sync-btn" onclick="loadDatabase(true)" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2 rounded-lg text-sm shadow transition">
            🔄 Download Latest Data
        </button>
    </header>

    <!-- App Layout -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-6">

        <!-- Filters Sidebar -->
        <aside class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 h-fit">
            <h2 class="font-bold text-lg mb-4 text-gray-700">🎯 Filters</h2>

            <!-- District Multi-Select -->
            <div class="mb-5">
                <div class="flex justify-between items-center mb-1">
                    <label class="block text-xs font-semibold uppercase text-gray-500">Districts (Bezirk)</label>
                    <button onclick="clearDistricts()" class="text-xs text-indigo-600 hover:underline">Clear all</button>
                </div>
                <div id="district-container" class="max-h-48 overflow-y-auto border rounded-lg p-2 space-y-1.5 bg-gray-50 text-xs">
                    <div class="text-gray-400 italic">Loading districts...</div>
                </div>
            </div>

            <!-- Multi-Keyword Exclude -->
            <div class="mb-5">
                <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Exclude Keywords</label>
                <input type="text" id="exclude-filter" placeholder="e.g. Integrationskurs, Deutsch, B1" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" oninput="resetPageAndRun()">
                <p class="text-[10px] text-gray-400 mt-1">Separate terms with commas to exclude multiple keywords.</p>
            </div>

            <!-- Date Range Filter -->
            <div class="mb-5">
                <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Course Start Date</label>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <span class="text-[10px] text-gray-400 block">From:</span>
                        <input type="date" id="date-from" class="w-full border rounded-lg p-1.5 text-xs focus:ring-2 focus:ring-indigo-500 outline-none" onchange="resetPageAndRun()">
                    </div>
                    <div>
                        <span class="text-[10px] text-gray-400 block">To:</span>
                        <input type="date" id="date-to" class="w-full border rounded-lg p-1.5 text-xs focus:ring-2 focus:ring-indigo-500 outline-none" onchange="resetPageAndRun()">
                    </div>
                </div>
            </div>

            <!-- Seats Availability -->
            <div class="mb-5 flex items-center gap-2">
                <input type="checkbox" id="seats-filter" class="rounded text-indigo-600 focus:ring-indigo-500" onchange="resetPageAndRun()">
                <label for="seats-filter" class="text-sm font-medium text-gray-700">Only available seats</label>
            </div>

            <!-- Sorting -->
            <div class="mb-5">
                <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Sort By</label>
                <select id="sort-filter" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500" onchange="resetPageAndRun()">
                    <option value="beginn ASC">Start Date (Soonest)</option>
                    <option value="numeric_price ASC">Price (Low to High)</option>
                    <option value="numeric_price DESC">Price (High to Low)</option>
                    <option value="available_seats DESC">Seats Available</option>
                </select>
            </div>

            <!-- Items Per Page -->
            <div class="mb-2">
                <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Items Per Page</label>
                <select id="page-size-filter" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500" onchange="resetPageAndRun()">
                    <option value="50">50 items</option>
                    <option value="100" selected>100 items</option>
                    <option value="250">250 items</option>
                    <option value="500">500 items</option>
                </select>
            </div>
        </aside>

        <!-- Main Results Column -->
        <main class="md:col-span-3">
            <!-- Search Input -->
            <div class="mb-4">
                <input type="text" id="search-query" placeholder="🔍 Search title, course number (FK3.111), tags, or keyword..."
                       class="w-full border border-gray-300 rounded-xl p-3 text-sm shadow-sm focus:ring-2 focus:ring-indigo-500 outline-none" oninput="resetPageAndRun()">
            </div>

            <!-- Metric Counter & Pagination Controls Bar -->
            <div class="flex flex-wrap justify-between items-center mb-4 text-sm text-gray-600 gap-2">
                <div id="status-bar" class="font-medium">Loading database...</div>
                <div id="pagination-controls" class="flex items-center gap-2 hidden">
                    <button id="prev-btn" onclick="changePage(-1)" class="px-3 py-1 bg-white border rounded-lg hover:bg-gray-100 disabled:opacity-40 disabled:cursor-not-allowed">← Prev</button>
                    <span id="page-indicator" class="text-xs font-semibold">Page 1 of 1</span>
                    <button id="next-btn" onclick="changePage(1)" class="px-3 py-1 bg-white border rounded-lg hover:bg-gray-100 disabled:opacity-40 disabled:cursor-not-allowed">Next →</button>
                </div>
            </div>

            <!-- Course List Container -->
            <div id="course-list" class="space-y-4"></div>
        </main>

    </div>
</div>

<script>
    let db = null;
    let bookmarks = new Set(JSON.parse(localStorage.getItem('vhs_bookmarks') || '[]'));
    let currentPage = 1;

    async function initSqlJS() {
      const SQL = await initSqlJs({
        locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}`
      });
      return SQL;
    }

    async function loadDatabase(forceRefresh = false) {
      document.getElementById('status-bar').innerText = '📥 Fetching SQLite database into browser WASM engine...';
      try {
        const SQL = await initSqlJS();
        const response = await fetch('vhs_courses.db' + (forceRefresh ? '?t=' + Date.now() : ''));
        const buf = await response.arrayBuffer();
        db = new SQL.Database(new Uint8Array(buf));

        populateDistricts();
        setupDateBounds();
        runQuery();
      } catch (err) {
        document.getElementById('status-bar').innerText = '❌ Failed to load SQLite database: ' + err.message;
      }
    }

    function populateDistricts() {
      const res = db.exec("SELECT DISTINCT bezirk FROM courses WHERE bezirk IS NOT NULL AND bezirk != '' ORDER BY bezirk ASC");
      const container = document.getElementById('district-container');
      container.innerHTML = '';

      if (res.length > 0) {
        res[0].values.forEach(([district], index) => {
          container.innerHTML += `
            <label class="flex items-center gap-2 cursor-pointer hover:text-indigo-600">
              <input type="checkbox" value="${district}" class="district-checkbox rounded text-indigo-600 focus:ring-indigo-500" onchange="resetPageAndRun()">
              <span>${district}</span>
            </label>
          `;
        });
      }
    }

    function setupDateBounds() {
      const res = db.exec("SELECT MIN(beginn), MAX(beginn) FROM courses WHERE beginn IS NOT NULL AND beginn != ''");
      if (res.length > 0 && res[0].values[0]) {
        const [minDate, maxDate] = res[0].values[0];
        const dateFromInput = document.getElementById('date-from');
        const dateToInput = document.getElementById('date-to');

        if (minDate) dateFromInput.min = minDate;
        if (maxDate) dateToInput.max = maxDate;
      }
    }

    function clearDistricts() {
      document.querySelectorAll('.district-checkbox').forEach(cb => cb.checked = false);
      resetPageAndRun();
    }

    function toggleBookmark(guid) {
      if (bookmarks.has(guid)) {
        bookmarks.delete(guid);
      } else {
        bookmarks.add(guid);
      }
      localStorage.setItem('vhs_bookmarks', JSON.stringify(Array.from(bookmarks)));
      runQuery();
    }

    function resetPageAndRun() {
      currentPage = 1;
      runQuery();
    }

    function changePage(delta) {
      currentPage += delta;
      runQuery();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function runQuery() {
      if (!db) return;

      // 1. Districts
      const selectedDistricts = Array.from(document.querySelectorAll('.district-checkbox:checked')).map(cb => cb.value);

      // 2. Exclude terms
      const excludeRaw = document.getElementById('exclude-filter').value;
      const excludeTerms = excludeRaw.split(',')
        .map(term => term.trim().toLowerCase())
        .filter(term => term.length > 0);

      // 3. Dates
      const dateFrom = document.getElementById('date-from').value;
      const dateTo = document.getElementById('date-to').value;

      const onlyAvailable = document.getElementById('seats-filter').checked;
      const sortBy = document.getElementById('sort-filter').value;
      const pageSize = parseInt(document.getElementById('page-size-filter').value) || 100;
      const search = document.getElementById('search-query').value.toLowerCase().trim();

      let conditions = ["1=1"];
      let params = [];

      if (selectedDistricts.length > 0) {
        const placeholders = selectedDistricts.map(() => '?').join(',');
        conditions.push(`bezirk IN (${placeholders})`);
        params.push(...selectedDistricts);
      }

      if (dateFrom) {
        conditions.push("beginn >= ?");
        params.push(dateFrom);
      }
      if (dateTo) {
        conditions.push("beginn <= ?");
        params.push(dateTo);
      }

      if (onlyAvailable) {
        conditions.push("available_seats > 0");
      }

      excludeTerms.forEach(term => {
        conditions.push("LOWER(name) NOT LIKE ?");
        params.push(`%${term}%`);
      });

      if (search) {
        conditions.push("(LOWER(name) LIKE ? OR LOWER(nummer) LIKE ? OR LOWER(tags) LIKE ? OR LOWER(description) LIKE ?)");
        params.push(`%${search}%`, `%${search}%`, `%${search}%`, `%${search}%`);
      }

      const whereClause = conditions.join(" AND ");

      // A. Get EXACT TOTAL COUNT
      const countSql = `SELECT COUNT(*) FROM courses WHERE ${whereClause}`;
      const countStmt = db.prepare(countSql);
      countStmt.bind(params);
      countStmt.step();
      const totalCount = countStmt.get()[0];
      countStmt.free();

      // Calculate Pagination
      const totalPages = Math.max(1, Math.ceil(totalCount / pageSize));
      if (currentPage > totalPages) currentPage = totalPages;
      if (currentPage < 1) currentPage = 1;
      const offset = (currentPage - 1) * pageSize;

      // B. Fetch Paginated Records
      const sql = `
        SELECT guid, nummer, name, bezirk, beginn, ende, numeric_price, raw_price, available_seats, cur_seats, max_seats, tags, description, location, dozent, url
        FROM courses
        WHERE ${whereClause}
        ORDER BY ${sortBy}
        LIMIT ? OFFSET ?
      `;

      const stmt = db.prepare(sql);
      stmt.bind([...params, pageSize, offset]);

      let html = "";
      let displayedCount = 0;

      while (stmt.step()) {
        displayedCount++;
        const row = stmt.getAsObject();
        const isBookmarked = bookmarks.has(row.guid);

        html += `
          <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 hover:border-indigo-200 transition">
            <div class="flex justify-between items-start">
              <div>
                <span class="text-xs font-semibold px-2 py-0.5 rounded bg-gray-100 text-gray-600">${row.bezirk}</span>
                <span class="text-xs font-mono text-gray-400 ml-2">[${row.nummer}]</span>
                <h3 class="text-base font-bold text-gray-900 mt-1">${row.name}</h3>
              </div>
              <button onclick="toggleBookmark('${row.guid}')" class="text-xl">
                ${isBookmarked ? '⭐' : '☆'}
              </button>
            </div>

            <p class="text-sm text-gray-600 mt-2 line-clamp-2">${row.description || 'No description provided.'}</p>

            <div class="mt-4 flex flex-wrap gap-4 text-xs text-gray-500 border-t pt-3">
              <div>📍 <b>Location:</b> ${row.location}</div>
              <div>📅 <b>Start:</b> ${row.beginn}</div>
              <div>💶 <b>Price:</b> ${row.raw_price} €</div>
              <div>🪑 <b>Seats:</b> ${row.available_seats > 0 ? `🟢 ${row.available_seats} free` : '🔴 Full'}</div>
            </div>

            ${row.url ? `
              <div class="mt-3 text-right">
                <a href="${row.url}" target="_blank" class="inline-block text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-semibold px-3 py-1.5 rounded-lg transition">
                  Book on VHS Site 🔗
                </a>
              </div>
            ` : ''}
          </div>
        `;
      }
      stmt.free();

      // Update Header Text & Pagination Buttons
      const startItem = totalCount > 0 ? offset + 1 : 0;
      const endItem = Math.min(offset + pageSize, totalCount);

      document.getElementById('status-bar').innerText = `Showing ${startItem}-${endItem} of ${totalCount.toLocaleString()} courses found`;

      const controls = document.getElementById('pagination-controls');
      if (totalCount > pageSize) {
        controls.classList.remove('hidden');
        document.getElementById('page-indicator').innerText = `Page ${currentPage} of ${totalPages}`;
        document.getElementById('prev-btn').disabled = (currentPage === 1);
        document.getElementById('next-btn').disabled = (currentPage === totalPages);
      } else {
        controls.classList.add('hidden');
      }

      document.getElementById('course-list').innerHTML = html || '<div class="text-gray-400 p-8 text-center bg-white rounded-xl">No matching courses found.</div>';
    }

    // Load database automatically on startup
    window.addEventListener('DOMContentLoaded', () => loadDatabase(false));
</script>
</body>
</html>
